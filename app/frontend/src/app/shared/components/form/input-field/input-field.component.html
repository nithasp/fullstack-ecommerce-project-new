<div class="input-field"
     [class.input-field--error]="showErrors">
  <label class="input-field__label" [for]="name">
    {{ label }}
    <span *ngIf="required" class="input-field__required">*</span>
  </label>
  <div class="input-field__control">
    <input
      class="input-field__input"
      [class.input-field__input--with-toggle]="isPassword"
      [type]="inputType"
      [id]="name"
      [name]="name"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
      [attr.aria-invalid]="showErrors"
      [attr.aria-describedby]="name + '-feedback'"
    />
    <button
      *ngIf="isPassword"
      type="button"
      class="input-field__toggle"
      [disabled]="disabled"
      [attr.aria-label]="passwordShown ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="passwordShown"
      (click)="togglePassword()"
    >
      <svg *ngIf="!passwordShown" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg *ngIf="passwordShown" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
  </div>
  <div class="input-field__feedback" [id]="name + '-feedback'">
    <span *ngIf="showErrors" class="input-field__error-msg">
      {{ errors[0] }}
    </span>
  </div>
</div>
