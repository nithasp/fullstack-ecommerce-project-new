<nav class="navbar">
  <div class="navbar__container">
    <a routerLink="/products" class="navbar__brand" (click)="closeMobileMenu()">
      <span class="navbar__logo">&#9670;</span>
      {{ title }}
    </a>

    <button
      class="navbar__toggle"
      [class.navbar__toggle--active]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-label="Toggle navigation"
    >
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
    </button>

    <div
      class="navbar__backdrop"
      [class.navbar__backdrop--visible]="mobileMenuOpen"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>

    <div
      class="navbar__menu"
      [class.navbar__menu--open]="mobileMenuOpen"
      [class.navbar__menu--closing]="menuClosing"
      (animationend)="onMenuAnimationDone($event)"
    >
      <ng-container *ngIf="isLoggedIn$ | async">
        <a
          routerLink="/products"
          routerLinkActive="navbar__link--active"
          class="navbar__link"
          (click)="closeMobileMenu()"
        >
          <app-icon class="navbar__link-icon" name="nav/grid"></app-icon>
          <span>Products</span>
        </a>

        <a
          *ngIf="isAdmin$ | async"
          routerLink="/admin/activity"
          routerLinkActive="navbar__link--active"
          class="navbar__link"
          (click)="closeMobileMenu()"
        >
          <app-icon class="navbar__link-icon" name="nav/activity"></app-icon>
          <span>Activity Log</span>
        </a>

        <a
          routerLink="/cart"
          routerLinkActive="navbar__link--active"
          class="navbar__link navbar__cart-link"
          (click)="closeMobileMenu()"
          aria-label="Cart"
        >
          <span class="navbar__cart-icon-wrap">
            <app-icon class="navbar__cart-icon" name="commerce/cart"></app-icon>
            <ng-container *ngIf="cartCount$ | async as cartCount">
              <span *ngIf="cartCount > 0" class="navbar__badge">{{ cartCount }}</span>
            </ng-container>
          </span>
          <span class="navbar__cart-label">Cart</span>
        </a>

        <div class="navbar__user-menu" [class.navbar__user-menu--open]="userMenuOpen">
          <button
            class="navbar__user-trigger"
            (click)="toggleUserMenu()"
            [attr.aria-expanded]="userMenuOpen"
            aria-haspopup="true"
          >
            <span class="navbar__user-avatar">
              <app-icon name="nav/user"></app-icon>
            </span>
            <span class="navbar__username">{{ displayName$ | async }}</span>
            <app-icon
              class="navbar__user-chevron"
              [class.navbar__user-chevron--up]="userMenuOpen"
              name="ui/chevron-down"
            ></app-icon>
          </button>

          <div class="navbar__user-dropdown" *ngIf="userMenuOpen">
            <button class="navbar__user-dropdown-item navbar__user-dropdown-item--logout" (click)="logout()">
              <app-icon name="nav/logout"></app-icon>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="(isLoggedIn$ | async) === false">
        <a
          routerLink="/auth/login"
          routerLinkActive="navbar__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navbar__link navbar__auth-btn--login"
          (click)="closeMobileMenu()"
        >
          <app-icon class="navbar__link-icon" name="nav/login"></app-icon>
          <span>Login</span>
        </a>

        <a
          routerLink="/auth/register"
          routerLinkActive="navbar__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navbar__link navbar__auth-btn--register"
          (click)="closeMobileMenu()"
        >
          <app-icon class="navbar__link-icon" name="nav/user-plus"></app-icon>
          <span>Register</span>
        </a>
      </ng-container>
    </div>
  </div>
</nav>
