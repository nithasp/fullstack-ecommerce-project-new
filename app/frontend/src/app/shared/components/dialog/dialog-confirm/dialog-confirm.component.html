<div
  class="confirm-overlay"
  *ngIf="config"
  [class.confirm-overlay--closing]="closing"
  (click)="onOverlayClick()"
>
  <div
    class="confirm-dialog"
    [class.confirm-dialog--closing]="closing"
    [class.confirm-dialog--danger]="config.danger"
    (click)="$event.stopPropagation()"
    appFocusTrap
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-message"
    tabindex="-1"
  >
    <div class="confirm-dialog__icon" [class.confirm-dialog__icon--danger]="config.danger">
      <app-icon [name]="config.danger ? 'feedback/alert-triangle' : 'feedback/info-circle'"></app-icon>
    </div>

    <h2 id="confirm-dialog-title" class="confirm-dialog__title">{{ config.title }}</h2>
    <p id="confirm-dialog-message" class="confirm-dialog__message">{{ config.message }}</p>
    <div class="confirm-dialog__actions">
      <button type="button" class="confirm-dialog__cancel" (click)="cancel()">
        {{ config.cancelText || 'Cancel' }}
      </button>
      <button
        type="button"
        class="confirm-dialog__confirm"
        [class.confirm-dialog__confirm--danger]="config.danger"
        (click)="confirm()"
      >
        {{ config.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
