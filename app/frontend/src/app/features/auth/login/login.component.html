<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <div class="auth-card__icon">
        <app-icon name="nav/login"></app-icon>
      </div>
      <h2>Welcome Back</h2>
      <p class="auth-card__subtitle">Sign in to your account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card__form" novalidate>
      <app-input-field
        name="username"
        label="Username"
        placeholder="Enter your username"
        formControlName="username"
      ></app-input-field>

      <app-input-field
        name="password"
        label="Password"
        type="password"
        placeholder="Enter your password"
        formControlName="password"
      ></app-input-field>

      <button type="submit" class="auth-btn" [disabled]="isLoading || isDemoLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="auth-btn__loading">
          <app-loading-spinner
            size="small"
            layout="inline"
            message="Signing in..."
            variant="light"
          ></app-loading-spinner>
        </span>
      </button>
    </form>

    <ng-container *ngIf="demoEnabled">
      <div class="auth-divider"><span>or</span></div>

      <button
        type="button"
        class="auth-btn auth-btn--demo"
        [disabled]="isLoading || isDemoLoading"
        (click)="enterDemo()"
      >
        <span *ngIf="!isDemoLoading">Browse as a guest</span>
        <span *ngIf="isDemoLoading" class="auth-btn__loading">
          <app-loading-spinner
            size="small"
            layout="inline"
            message="Opening the demo..."
          ></app-loading-spinner>
        </span>
      </button>

      <p class="auth-hint">No account needed — a shared demo account with the store already set up.</p>
    </ng-container>

    <div class="auth-card__footer">
      <p>Don't have an account? <a routerLink="/auth/register">Create one</a></p>
    </div>
  </div>
</div>
