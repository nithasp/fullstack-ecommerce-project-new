<div class="confirmation animate-scale-in">
  <div class="confirmation__card">
    <div class="confirmation__icon">
      <img
        class="confirmation__icon-layer"
        src="assets/images/illustrations/order-success-ring.svg"
        alt=""
        width="80"
        height="80"
      />
      <img
        class="confirmation__icon-layer confirmation__icon-check"
        src="assets/images/illustrations/order-success-check.svg"
        alt=""
        width="80"
        height="80"
      />
    </div>

    <h1 class="confirmation__title">Order Confirmed!</h1>
    <p class="confirmation__message">
      Thank you for your purchase. Your order has been placed successfully and is being processed.
    </p>
    <p class="confirmation__sub-message">A confirmation email will be sent to your inbox shortly.</p>

    <button class="confirmation__btn" (click)="continueShopping()">Continue Shopping</button>
  </div>
</div>
